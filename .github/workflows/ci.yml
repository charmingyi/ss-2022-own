name: manager checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      # Pin the action to a full commit; do not use a moving tag in this repo.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Shell syntax
        run: bash -n ssctl.sh bootstrap.sh build-core.sh package-release.sh tests/test_manager.sh tests/test_menu.sh
      - name: Python syntax
        run: python3 -m py_compile lib/ssctl.py
      - name: Manager tests
        run: tests/test_manager.sh
      - name: Diff check
        run: git diff --check
